# Publish RFHound to PyPI on a version tag (e.g. `git tag v1.3.0 && git push --tags`).
#
# Uses PyPI **Trusted Publishing** (OIDC) — no API token is stored anywhere.
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/):
#   Project name:      rfhound
#   Owner:             jawaman14
#   Repository name:   rfhound
#   Workflow filename: publish.yml
#   Environment name:  pypi
# (If you prefer an API token instead, delete the `permissions: id-token` and
#  `environment` blocks below and add `with: { password: ${{ secrets.PYPI_API_TOKEN }} }`
#  to the publish step, then set the PYPI_API_TOKEN repo secret.)
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: flake8 rfhound tests --max-line-length=110 --extend-ignore=E203,W503
      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rfhound
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
